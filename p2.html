<html>
  <head>
    <link rel="stylesheet" href="p2.css" />
    <script
      src="https://www.cs.unm.edu/~angel/WebGL/7E/Common/initShaders.js"
      defer
    ></script>
    <script
      src="https://www.cs.unm.edu/~angel/WebGL/7E/Common/MV.js"
      defer
    ></script>
    <script
      src="models.js"
      defer
    ></script>
    <script src="p2.js" defer></script>
  </head>
  <body>
    <div id="container">
      <div class="app">
        <div class="title">Flight Simulator</div>
        <div class="labels">
          <span class="yaw">Yaw</span>
          <span class="pitch">Pitch</span>
          <span class="roll">Roll</span>
        </div>
        <!-- end label -->
        <div class="planes">
          <canvas id="xz"></canvas>
          <canvas id="yz"></canvas>
          <canvas id="xy"></canvas>
        </div>
        <!-- end mission -->
        <div class="sim">
          <canvas id="xyz"></canvas>
          <div class="control">
            <ul>
              <li><button type="button" id="roll-left"></button></li>
              <li><button type="button" id="pitch-up"></button></li>
              <li><button type="button" id="roll-right"></button></li>
            </ul>
            <ul>
              <li><button type="button" id="yaw-left"></button></li>
              <li><button type="button" id="pitch-down"></button></li>
              <li><button type="button" id="yaw-right"></button></li>
            </ul>
            <ul>
              <li><button type="button" class="blank"></button></li>
              <li><button type="button" id="reset"></button></li>
              <li><button type="button" class="blank"></button></li>
            </ul>
          </div>
          <!-- end control -->
        </div>
        <!-- end sim -->
      </div>
      <!-- end app -->
    </div>
    <!-- end containter -->
  </body>

  <script id="vertex-shader" type="x-shader/x-vertex">
    
    attribute vec3 vertex;
    uniform vec4 props;
    uniform float z_translation;

    void main() {
        float rotX = props.x;
        float rotY = props.y; 
        float rotZ = props.z;
        float scaleVal = props.w;
        
        vec3 position = vertex * scaleVal;
        position.z += z_translation;
        
        float cosX = cos(rotX);
        float sinX = sin(rotX);
        float cosY = cos(rotY);
        float sinY = sin(rotY);
        float cosZ = cos(rotZ);
        float sinZ = sin(rotZ);
        
        vec3 transformed;
        
        transformed.x = cosZ * position.x - sinZ * position.y;
        transformed.y = sinZ * position.x + cosZ * position.y;
        transformed.z = position.z;
        
        position = transformed;
        transformed.x = cosY * position.x + sinY * position.z;
        transformed.y = position.y;
        transformed.z = -sinY * position.x + cosY * position.z;
        
        position = transformed;
        transformed.x = position.x;
        transformed.y = cosX * position.y - sinX * position.z;
        transformed.z = sinX * position.y + cosX * position.z;
        
        gl_Position = vec4(transformed, 1.0);
    }
  </script>

  <script id="fragment-shader" type="x-shader/x-fragment">

    precision lowp float;

    uniform vec4 color;

    void main() {
        gl_FragColor = color;
    }
  </script>
</html>
